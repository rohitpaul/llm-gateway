[project]
name = "llm-gateway"
version = "0.1.0"
description = "Lightweight LLM proxy with virtual keys, per-model usage tracking, and a clean dashboard. Drop-in LiteLLM replacement."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "uvicorn[standard]>=0.44.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
