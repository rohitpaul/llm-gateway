name: E2E Test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'templates/**'
      - 'static/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'config.yaml'
      - '.github/workflows/e2e-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    env:
      GATEWAY_ADMIN_KEY: sk-test-admin-key-e2e
      GATEWAY_DB: /tmp/test-gateway.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install "fastapi[standard]" "uvicorn[standard]" httpx aiosqlite pyyaml python-dotenv pydantic

      - name: Create minimal config
        run: |
          printf 'models: {}\nproviders: {}\n' > config.yaml

      - name: Test server import
        id: import-test
        run: |
          python3 -c "
          import sys, traceback
          sys.path.insert(0, '.')
          try:
              from app import server
              print('Import OK')
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          " 2>&1 | tee /tmp/import-output.txt

      - name: Start server and run tests
        run: |
          python3 -m uvicorn app.server:app --host 127.0.0.1 --port 4000 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            cat /tmp/server.log
            exit 1
          fi

          curl -sf http://localhost:4000/health || { echo "FAIL /health"; cat /tmp/server.log; exit 1; }
          echo ""

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/)
          echo "Dashboard: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/v1/models)
          echo "/v1/models: $STATUS"
          [ "$STATUS" != "500" ]

          RESPONSE=$(curl -sf -X POST http://localhost:4000/admin/keys \
            -H "Authorization: Bearer ${{ env.GATEWAY_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"name": "e2e-test-key"}')
          echo "Create key: $RESPONSE"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ env.GATEWAY_ADMIN_KEY }}" \
            http://localhost:4000/admin/keys)
          [ "$STATUS" = "200" ] || exit 1

          for ep in summary models providers daily; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ env.GATEWAY_ADMIN_KEY }}" \
              "http://localhost:4000/api/stats/$ep")
            echo "/api/stats/$ep: $STATUS"
            [ "$STATUS" = "200" ] || exit 1
          done

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health/providers)
          echo "Provider health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer sk-wrong" \
            http://localhost:4000/admin/keys)
          echo "Auth rejection: $STATUS"
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || exit 1

          echo "ALL TESTS PASSED"
          kill $SERVER_PID 2>/dev/null || true

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Upload diagnostic output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-python-diag
          retention-days: 1
          path: |
            /tmp/import-output.txt
            /tmp/server.log

  test-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: llm-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          echo "== /app =="
          docker run --rm llm-gateway:test ls -la /app/
          echo "== /app/static =="
          docker run --rm llm-gateway:test ls -laR /app/static/
          echo "== /app/templates =="
          docker run --rm llm-gateway:test ls -la /app/templates/
          echo "== Python import =="
          docker run --rm -e GATEWAY_DB=/tmp/test.db llm-gateway:test python3 -c "
          import sys, traceback
          try:
              import app.server
              print('Import OK')
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          "

      - name: Upload docker diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-docker-diag
          retention-days: 1
          path: /tmp/docker-verify.log
