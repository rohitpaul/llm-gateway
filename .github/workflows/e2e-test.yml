name: E2E Test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'templates/**'
      - 'static/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'config.yaml'
      - '.github/workflows/e2e-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GATEWAY_ADMIN_KEY: sk-test-admin-key-e2e
  GATEWAY_DB: /tmp/test-gateway.db

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install fastapi uvicorn[standard] httpx aiosqlite pyyaml python-dotenv pydantic

      - name: Create minimal config
        run: printf 'models: {}\nproviders: {}\n' > config.yaml

      - name: Start server in background
        run: |
          uvicorn app.server:app --host 127.0.0.1 --port 4000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Give it time to start (or crash)
          sleep 5
          # Check if process is still running
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server crashed on startup!"
            wait $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "Server started with PID $SERVER_PID"

      - name: Test /health endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:4000/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status') == 'ok'; print('OK /health')"

      - name: Test dashboard (/)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/)
          if [ "$STATUS" -ne 200 ]; then
            echo "Dashboard returned $STATUS"
            exit 1
          fi
          echo "OK dashboard ($STATUS)"

      - name: Test /v1/models (unauthenticated)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/v1/models)
          if [ "$STATUS" -eq 500 ]; then
            echo "/v1/models crashed"
            exit 1
          fi
          echo "OK /v1/models ($STATUS)"

      - name: Test admin key creation
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:4000/admin/keys \
            -H "Authorization: Bearer ${{ env.GATEWAY_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"name": "e2e-test-key"}')
          echo "Create: $RESPONSE"
          KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('key',''))" 2>/dev/null || true)
          if [ -z "$KEY" ]; then
            echo "Failed to create key"
            exit 1
          fi
          echo "OK key created: ${KEY:0:10}..."

      - name: Test admin key listing
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ env.GATEWAY_ADMIN_KEY }}" \
            http://localhost:4000/admin/keys)
          if [ "$STATUS" -ne 200 ]; then
            echo "Key listing returned $STATUS"
            exit 1
          fi
          echo "OK key listing ($STATUS)"

      - name: Test admin stats endpoints
        run: |
          for ep in summary models providers daily; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ env.GATEWAY_ADMIN_KEY }}" \
              "http://localhost:4000/api/stats/$ep")
            if [ "$STATUS" -ne 200 ]; then
              echo "/api/stats/$ep returned $STATUS"
              exit 1
            fi
            echo "OK /api/stats/$ep"
          done

      - name: Test provider health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health/providers)
          if [ "$STATUS" -ne 200 ]; then
            echo "Provider health returned $STATUS"
            exit 1
          fi
          echo "OK provider health ($STATUS)"

      - name: Test auth rejection (bad key)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer sk-wrong" \
            http://localhost:4000/admin/keys)
          if [ "$STATUS" -ne 401 ] && [ "$STATUS" -ne 403 ]; then
            echo "Bad key returned $STATUS, expected 401/403"
            exit 1
          fi
          echo "OK auth rejection ($STATUS)"

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

  test-docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: llm-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image has all files
        run: |
          echo "== Checking /app contents =="
          docker run --rm llm-gateway:test ls -la /app/
          echo "== Checking /app/static =="
          docker run --rm llm-gateway:test ls -la /app/static/
          echo "== Checking /app/templates =="
          docker run --rm llm-gateway:test ls -la /app/templates/
          echo "== Verifying Python imports =="
          docker run --rm -e GATEWAY_DB=/tmp/test.db llm-gateway:test python3 -c "import app.server; print('Import OK')"
