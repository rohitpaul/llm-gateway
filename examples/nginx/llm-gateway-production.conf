# Nginx Configuration with SSL and Rate Limiting
# Production-ready setup

# Rate limiting zones (add to http block in nginx.conf)
# limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
# limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;

upstream llm_gateway {
    least_conn;
    server gateway:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name gateway.example.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name gateway.example.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Logging
    access_log /var/log/nginx/llm-gateway.access.log;
    error_log /var/log/nginx/llm-gateway.error.log warn;
    
    # Maximum body size
    client_max_body_size 50M;
    
    # API endpoints
    location / {
        # Rate limiting
        limit_req zone=general burst=50 nodelay;
        
        proxy_pass http://llm_gateway;
        
        # CRITICAL: Disable buffering for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }
    
    # Static assets with aggressive caching
    location /static/ {
        proxy_pass http://llm_gateway;
        proxy_buffering on;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check (no rate limiting, no auth)
    location /health {
        proxy_pass http://llm_gateway;
        access_log off;
        limit_req off;
    }
    
    # Metrics endpoint (restrict to monitoring systems)
    location /metrics {
        # IP whitelist for Prometheus/Grafana
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        deny all;
        
        proxy_pass http://llm_gateway;
        proxy_buffering off;
        limit_req off;
    }
    
    # Admin endpoints (strict rate limiting)
    location /admin/ {
        limit_req zone=admin burst=5 nodelay;
        
        # Optional: IP whitelist
        # allow 10.0.0.0/8;
        # deny all;
        
        # Optional: Basic auth (additional layer)
        # auth_basic "Admin Area";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://llm_gateway;
        proxy_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Nginx status (for monitoring)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
}
