# Nginx Configuration for LLM Gateway
# Copy to: /etc/nginx/conf.d/llm-gateway.conf

upstream llm_gateway {
    least_conn;
    server gateway:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;
    
    # For development without SSL
    location / {
        proxy_pass http://llm_gateway;
        
        # CRITICAL: Disable buffering for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        
        # Timeouts (LLM requests can be slow)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Don't buffer request body
        proxy_request_buffering off;
    }
    
    # Static assets with caching
    location /static/ {
        proxy_pass http://llm_gateway;
        proxy_buffering on;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check (no auth required)
    location /health {
        proxy_pass http://llm_gateway;
        access_log off;
    }
    
    # Maximum body size
    client_max_body_size 10M;
}
