# Docker Compose with Nginx Reverse Proxy
# Production-ready setup

version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: llm-gateway-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./examples/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/nginx/llm-gateway-production.conf:/etc/nginx/conf.d/llm-gateway.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - gateway
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM Gateway Application
  gateway:
    image: ghcr.io/rohitpaul/llm-gateway:latest
    container_name: llm-gateway
    restart: unless-stopped
    expose:
      - "4000"
    volumes:
      - gateway-data:/data
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - GATEWAY_DB=/data/gateway.db
      - GATEWAY_ADMIN_KEY=${GATEWAY_ADMIN_KEY:?GATEWAY_ADMIN_KEY must be set}
      - GATEWAY_PORT=4000
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus (optional - for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-gateway-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - gateway-network
    profiles:
      - monitoring

  # Grafana (optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: llm-gateway-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - gateway-network
    profiles:
      - monitoring

volumes:
  gateway-data:
  nginx-logs:
  prometheus-data:
  grafana-data:

networks:
  gateway-network:
    driver: bridge
