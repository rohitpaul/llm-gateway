services:
  llm-gateway:
    build: .
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:${GATEWAY_PORT:-4000}"
    volumes:
      - llm-gateway-data:/data
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GATEWAY_DB=/data/gateway.db
      - GATEWAY_ADMIN_KEY=${GATEWAY_ADMIN_KEY:-sk-admin-change-me}
      - GATEWAY_PORT=${GATEWAY_PORT:-4000}
      - TZ=America/New_York

volumes:
  llm-gateway-data:
