services:
  llm-gateway:
    build: .
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    volumes:
      - llm-gateway-data:/data
      - ${GATEWAY_CONFIG_PATH:-./config.yaml}:/app/config.yaml:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GATEWAY_DB=/data/gateway.db
      - GATEWAY_ADMIN_KEY=${GATEWAY_ADMIN_KEY:?GATEWAY_ADMIN_KEY must be set}
      - GATEWAY_CORS_ORIGINS=${GATEWAY_CORS_ORIGINS:-}
      - TZ=America/New_York

volumes:
  llm-gateway-data:
