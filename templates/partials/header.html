<!-- Header -->
<header x-show="authenticated" x-cloak class="border-b border-gray-800 px-3 sm:px-6 py-3 sm:py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-7 h-7 sm:w-8 sm:h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xs sm:text-sm">G</div>
            <h1 class="text-lg sm:text-xl font-semibold">Gateway</h1>
            <span class="text-xs text-gray-500 bg-gray-800 px-1.5 py-0.5 rounded hidden sm:inline-block" x-text="summary.total_requests + ' requests'"></span>
        </div>
        <div class="flex items-center gap-2 sm:gap-4 text-sm">
            <!-- Mobile: compact inline stats -->
            <div class="sm:hidden flex items-center gap-2 text-xs">
                <span class="font-mono text-green-400" x-text="'$' + (summary.total_cost || 0).toFixed(2)"></span>
                <span class="text-gray-600">|</span>
                <span class="font-mono text-gray-300" x-text="formatTokens((summary.total_input_tokens || 0) + (summary.total_output_tokens || 0))"></span>
            </div>
            <!-- Desktop: full stats -->
            <div class="hidden sm:flex items-center gap-4 text-sm">
                <button @click="signOut()" class="text-gray-500 hover:text-gray-300 text-xs border border-gray-700 rounded px-2 py-1 hover:border-gray-500 transition">Sign out</button>
                <div class="text-center">
                    <div class="text-gray-400 text-xs">Cost</div>
                    <div class="font-mono text-green-400" x-text="'$' + (summary.total_cost || 0).toFixed(4)">$0</div>
                </div>
                <div class="text-center">
                    <div class="text-gray-400 text-xs">Tokens</div>
                    <div class="font-mono" x-text="formatTokens((summary.total_input_tokens || 0) + (summary.total_output_tokens || 0))">0</div>
                </div>
                <div class="text-center">
                    <div class="text-gray-400 text-xs">Models</div>
                    <div class="font-mono" x-text="summary.unique_models || 0">0</div>
                </div>
            </div>
            <button @click="signOut()" class="sm:hidden text-gray-500 text-xs border border-gray-700 rounded px-1.5 py-1">⏻</button>
        </div>
    </div>
</header>
