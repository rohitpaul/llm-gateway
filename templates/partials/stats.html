   <!-- Stats Tab -->
    <div x-show="tab==='stats'" x-cloak class="fade-in space-y-6">
        <!-- Reset Button -->
        <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">Statistics</h2>
            <button @click="confirmResetStats()"
                    class="px-3 py-1.5 text-xs bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-600/50 rounded transition"
                    :disabled="statsResetting">
                <span x-text="statsResetting ? 'Resetting...' : 'Reset All Stats'"></span>
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-4">
            <div class="bg-gray-900 rounded-lg p-3 sm:p-4 border border-gray-800">
                <div class="text-[10px] sm:text-xs text-gray-400 mb-0.5 sm:mb-1">Total Requests</div>
                <div class="text-lg sm:text-2xl font-bold" x-text="(summary.total_requests || 0).toLocaleString()">0</div>
            </div>
            <div class="bg-gray-900 rounded-lg p-3 sm:p-4 border border-gray-800">
                <div class="text-[10px] sm:text-xs text-gray-400 mb-0.5 sm:mb-1">Total Cost</div>
                <div class="text-lg sm:text-2xl font-bold text-green-400" x-text="'$' + (summary.total_cost || 0).toFixed(2)">$0</div>
            </div>
            <div class="bg-gray-900 rounded-lg p-3 sm:p-4 border border-gray-800">
                <div class="text-[10px] sm:text-xs text-gray-400 mb-0.5 sm:mb-1">Input Tokens</div>
                <div class="text-lg sm:text-2xl font-bold" x-text="formatTokens(summary.total_input_tokens || 0)">0</div>
            </div>
            <div class="bg-gray-900 rounded-lg p-3 sm:p-4 border border-gray-800">
                <div class="text-[10px] sm:text-xs text-gray-400 mb-0.5 sm:mb-1">Output Tokens</div>
                <div class="text-lg sm:text-2xl font-bold" x-text="formatTokens(summary.total_output_tokens || 0)">0</div>
            </div>
        </div>

        <!-- Provider Stats with Error Rate -->
        <div class="bg-gray-900 rounded-lg p-4 border border-gray-800">
            <h3 class="text-sm font-medium text-gray-300 mb-3">Provider Stats & Error Rate</h3>
            <div class="space-y-2">
                <template x-for="p in providerStats" :key="p.provider">
                    <div class="flex items-center justify-between text-sm py-1 border-b border-gray-800 last:border-0">
                        <div class="flex items-center gap-4">
                            <span class="text-gray-300 capitalize font-medium" x-text="p.provider"></span>
                            <span class="text-gray-500 text-xs" x-text="(p.request_count || 0).toLocaleString() + ' req'"></span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <div class="text-xs text-gray-500">Error Rate</div>
                                <div class="font-bold" 
                                     :class="p.error_rate > 5 ? 'text-red-400' : p.error_rate > 1 ? 'text-yellow-400' : 'text-green-400'"
                                     x-text="p.error_rate ? p.error_rate.toFixed(1) + '%' : '0.0%'">0%</div>
                            </div>
                            <div class="text-right min-w-[80px]">
                                <div class="text-xs text-gray-500">Cost</div>
                                <div class="text-green-400 font-mono" x-text="'$' + (p.cost || 0).toFixed(4)">$0.0000</div>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="providerStats.length === 0" class="text-gray-500 text-sm text-center py-4">No data yet</div>
            </div>
        </div>

        <!-- Model TPS Performance -->
        <div class="bg-gray-900 rounded-lg p-4 border border-gray-800">
            <h3 class="text-sm font-medium text-gray-300 mb-3">Model Performance (Tokens/sec)</h3>
            <div class="space-y-2">
                <template x-for="m in modelStats" :key="m.model">
                    <div class="flex items-center justify-between text-sm py-1 border-b border-gray-800 last:border-0">
                        <div class="flex items-center gap-4">
                            <span class="text-gray-300 truncate max-w-[150px] sm:max-w-[250px]" x-text="m.model" :title="m.model"></span>
                            <span class="text-gray-500 text-xs" x-text="(m.request_count || 0).toLocaleString() + ' req'"></span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right min-w-[90px]">
                                <div class="text-xs text-gray-500">Avg TPS</div>
                                <div class="font-bold text-blue-400" x-text="m.avg_tps ? m.avg_tps.toFixed(1) + ' tok/s' : '—'">—</div>
                            </div>
                            <div class="text-right min-w-[80px]">
                                <div class="text-xs text-gray-500">Cost</div>
                                <div class="text-green-400 font-mono" x-text="'$' + (m.cost || 0).toFixed(4)">$0.0000</div>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="modelStats.length === 0" class="text-gray-500 text-sm text-center py-4">No data yet</div>
            </div>
        </div>

        <!-- Provider health -->
        <div class="bg-gray-900 rounded-lg p-4 border border-gray-800">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-medium text-gray-300">Provider Health</h3>
                <button @click="checkProviderHealth()" class="text-xs text-blue-400 hover:text-blue-300" x-text="providerHealthLoading ? 'Checking...' : 'Check now'"></button>
            </div>
            <div class="space-y-1.5">
                <template x-for="[name, info] in Object.entries(providerHealth)" :key="name">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-300 capitalize" x-text="name"></span>
                        <div class="flex items-center gap-2">
                            <span x-show="info.latency_ms" class="text-gray-500 font-mono text-xs" x-text="(info.latency_ms || 0).toFixed(0) + 'ms'"></span>
                            <span x-show="info.status==='reachable'" class="text-green-400 text-xs">✓ up</span>
                            <span x-show="info.status==='error'" class="text-yellow-400 text-xs" :title="info.error">⚠ error</span>
                            <span x-show="info.status==='unreachable'" class="text-red-400 text-xs" :title="info.error">✗ down</span>
                            <span x-show="info.status==='no_url'" class="text-gray-600 text-xs">not configured</span>
                        </div>
                    </div>
                </template>
                <div x-show="Object.keys(providerHealth).length === 0" class="text-gray-500 text-sm text-center py-3">No providers configured</div>
            </div>
        </div>
    </div>
