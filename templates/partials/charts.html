<!-- Charts Tab -->
    <div x-show="tab==='charts'" x-cloak class="fade-in space-y-4">
        <div class="bg-gray-900 rounded-lg p-4 border border-gray-800">
            <!-- Filters -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h3 class="text-sm font-medium text-gray-300">Usage Analytics</h3>
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Model filter -->
                    <select x-model="selectedModel" @change="loadChartData()"
                            class="bg-gray-800 text-gray-300 text-xs rounded px-2 py-1 border border-gray-700 focus:border-blue-500 focus:outline-none">
                        <option value="">All Models</option>
                        <template x-for="m in modelsList" :key="m.name">
                            <option :value="m.name" x-text="m.name"></option>
                        </template>
                    </select>
                    <!-- Time range -->
                    <div class="flex gap-1 text-xs">
                        <button @click="chartMode = 'hourly'; loadChartData()"
                                :class="chartMode === 'hourly' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-gray-200'"
                                class="px-2 py-1 rounded">Hourly</button>
                        <template x-for="d in [7, 14, 30]" :key="d">
                            <button @click="chartMode = 'daily'; chartDays = d; loadChartData()"
                                    :class="chartMode === 'daily' && chartDays === d ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-gray-200'"
                                    class="px-2 py-1 rounded" x-text="d + 'd'"></button>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Summary Stats Row -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <div class="bg-gray-800/50 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-[10px] text-gray-400 mb-1">Total Requests</div>
                    <div class="text-xl font-bold text-white" x-text="chartSummary.requests?.toLocaleString() || '0'">0</div>
                </div>
                <div class="bg-gray-800/50 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-[10px] text-gray-400 mb-1">Total Cost</div>
                    <div class="text-xl font-bold text-green-400" x-text="'$' + (chartSummary.cost || 0).toFixed(4)">$0</div>
                </div>
                <div class="bg-gray-800/50 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-[10px] text-gray-400 mb-1">Avg Latency</div>
                    <div class="text-xl font-bold text-blue-400" x-text="chartSummary.latency_ms ? (chartSummary.latency_ms >= 1000 ? (chartSummary.latency_ms/1000).toFixed(1) + 's' : chartSummary.latency_ms.toFixed(0) + 'ms') : '—'">—</div>
                </div>
                <div class="bg-gray-800/50 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-[10px] text-gray-400 mb-1">Cache Hit Rate</div>
                    <div class="text-xl font-bold text-yellow-400" x-text="chartSummary.cache_rate ? chartSummary.cache_rate.toFixed(1) + '%' : '0%'">0%</div>
                </div>
            </div>

            <!-- Charts grid -->
            <div class="grid md:grid-cols-2 gap-4">
                <!-- Chart 1: Token Volume -->
                <div class="bg-gray-800/30 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-xs font-medium text-gray-300 mb-2">Token Volume</div>
                    <div class="h-48">
                        <div id="chartTokens"></div>
                    </div>
                </div>
                <!-- Chart 2: Cost Trend -->
                <div class="bg-gray-800/30 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-xs font-medium text-gray-300 mb-2">Cost Trend</div>
                    <div class="h-48">
                        <div id="chartCost"></div>
                    </div>
                </div>
                <!-- Chart 3: Request Volume -->
                <div class="bg-gray-800/30 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-xs font-medium text-gray-300 mb-2">Request Volume</div>
                    <div class="h-48">
                        <div id="chartRequests"></div>
                    </div>
                </div>
                <!-- Chart 4: Token Distribution -->
                <div class="bg-gray-800/30 rounded-lg p-3 border border-gray-700/50">
                    <div class="text-xs font-medium text-gray-300 mb-2">Token Distribution</div>
                    <div class="h-48 flex items-center justify-center">
                        <div id="chartDistribution"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
