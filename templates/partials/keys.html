    <!-- Keys Tab -->
    <div x-show="tab==='keys'" x-cloak class="fade-in space-y-4">
        <!-- Create key form -->
        <div class="bg-gray-900 rounded-lg p-3 sm:p-4 border border-gray-800">
            <h3 class="text-sm font-medium text-gray-300 mb-3">Create Virtual Key</h3>
            <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-2 sm:gap-3 items-end">
                <div class="col-span-2 sm:col-span-auto">
                    <label class="text-xs text-gray-400 block mb-1">Name</label>
                    <input x-model="newKey.name" type="text" placeholder="my-app"
                           class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm w-full sm:w-40 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Providers (optional)</label>
                    <input x-model="newKey.provider_filter" type="text" placeholder="openAI,anthropic"
                           class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm w-full sm:w-48 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Models (optional)</label>
                    <input x-model="newKey.model_filter" type="text" placeholder="gpt-4o,claude-*"
                           class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm w-full sm:w-48 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Token Limit</label>
                    <input x-model="newKey.token_limit" type="number" placeholder="unlimited"
                           class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm w-full sm:w-32 focus:outline-none focus:border-blue-500">
                </div>
                <div class="col-span-2 sm:col-span-auto">
                    <button @click="createKey()" class="bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded text-sm font-medium w-full sm:w-auto">
                        Create Key
                    </button>
                </div>
            </div>
        </div>

        <!-- New key display -->
        <div x-show="createdKey" x-cloak x-transition class="bg-green-900/20 border border-green-800 rounded-lg p-4">
            <div class="flex items-center justify-between mb-2">
                <span class="text-green-400 text-sm font-medium">Key created — copy it now (won't be shown again)</span>
                <button @click="createdKey=null" class="text-gray-400 hover:text-gray-200 text-sm">✕</button>
            </div>
            <div class="bg-gray-900 rounded px-3 py-2 font-mono text-xs sm:text-sm flex items-center justify-between gap-2">
                <span class="break-all" x-text="createdKey?.key"></span>
                <button @click="navigator.clipboard.writeText(createdKey?.key)" class="text-blue-400 hover:text-blue-300 text-xs shrink-0">Copy</button>
            </div>
        </div>

        <!-- Keys list -->
        <div class="bg-gray-900 rounded-lg border border-gray-800 overflow-hidden">
            <table class="w-full text-sm mobile-cards">
                <thead class="bg-gray-800/50 text-gray-400 text-xs uppercase">
                    <tr>
                        <th class="px-4 py-3 text-left">Name</th>
                        <th class="px-4 py-3 text-left hide-mobile">Key</th>
                        <th class="px-4 py-3 text-left hide-mobile">Providers</th>
                        <th class="px-4 py-3 text-left hide-mobile">Models</th>
                        <th class="px-4 py-3 text-right">Requests</th>
                        <th class="px-4 py-3 text-right hide-mobile">Tokens Used</th>
                        <th class="px-4 py-3 text-left">Last Used</th>
                        <th class="px-4 py-3 text-center">Status</th>
                        <th class="px-4 py-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-800">
                    <template x-for="k in keys" :key="k.id">
                        <tr class="hover:bg-gray-800/30">
                            <td class="mobile-card-header px-4 py-2.5 font-medium" x-text="k.name" data-label=""></td>
                            <td class="px-4 py-1 font-mono text-xs text-gray-400 hide-mobile" x-text="k.key_prefix" data-label="Key"></td>
                            <td class="px-4 py-1 text-xs text-gray-400 hide-mobile" x-text="k.provider_filter || 'all'" data-label="Providers"></td>
                            <td class="px-4 py-1 text-xs text-gray-400 hide-mobile" x-text="k.model_filter || 'all'" data-label="Models"></td>
                            <td class="px-4 py-1 text-right font-mono" x-text="(k.request_count || 0).toLocaleString()" data-label="Requests"></td>
                            <td class="px-4 py-1 text-right font-mono hide-mobile" x-text="formatTokens(k.tokens_used || 0)" data-label="Tokens"></td>
                            <td class="px-4 py-1 text-xs text-gray-400" x-text="k.last_used_at ? formatTime(k.last_used_at) : 'never'" data-label="Last Used"></td>
                            <td class="px-4 py-1 text-right" data-label="Status">
                                <span x-show="k.is_active" class="text-green-500 text-xs">active</span>
                                <span x-show="!k.is_active" class="text-red-500 text-xs">inactive</span>
                            </td>
                            <td class="px-4 py-1 text-right" data-label="">
                                <button x-show="k.is_active" @click="deactivateKey(k.id)" class="text-yellow-500 hover:text-yellow-400 text-xs">pause</button>
                                <button x-show="!k.is_active" @click="reactivateKey(k.id)" class="text-blue-400 hover:text-blue-300 text-xs">resume</button>
                                <button @click="deleteKey(k.id)" class="text-red-500 hover:text-red-400 text-xs ml-2">delete</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div x-show="keys.length === 0" class="text-gray-500 text-sm text-center py-8">No keys yet — create one above</div>
        </div>
    </div>
